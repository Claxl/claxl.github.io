# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: blank # the website title (if blank, full name will be used instead)
first_name: Claudio
middle_name:
last_name: Di Salvo
email: claudio.disalvo@polimi.it
description: >
  PhD Student @ NECSTLab, Politecnico di Milano.
  Reconfigurable architectures for adaptive space vision computing.
lang: en
icon: 🛰️

# -----------------------------------------------------------------------------
# Open Graph & Schema.org
# -----------------------------------------------------------------------------

serve_og_meta: true
serve_schema_org: true
og_image: # path/to/image.jpg

# -----------------------------------------------------------------------------
# Site URL
# -----------------------------------------------------------------------------

# IMPORTANT: set these to match your deployment target.
# If the repo is named `<username>.github.io`, leave baseurl empty.
# If it's a project page (e.g. github.com/<user>/al-folio), set baseurl: "/al-folio"
url: https://claudiodisalvo.github.io
baseurl: ""
last_updated: true

# -----------------------------------------------------------------------------
# RSS Feed
# -----------------------------------------------------------------------------

rss_icon: true

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: true
max_width: 930px

# -----------------------------------------------------------------------------
# Open Graph / Social
# -----------------------------------------------------------------------------

# Replace placeholders with your actual handles / IDs when you have them
github_username: claudiodisalvo          # e.g. https://github.com/claudiodisalvo
linkedin_username: claudio-di-salvo      # e.g. linkedin.com/in/claudio-di-salvo
scholar_userid:                          # copy the `user=XXXX` from your Scholar URL
orcid_id:                                # 0000-0000-0000-0000
semanticscholar_id:
dblp_url:
researchgate_url:

# Academic / other
publons_id:
lattes_id:
osf_id:
research_gate_profile:

# Keep / remove as you like
x_username:
mastodon_username:
bluesky_url:
threads_username:
medium_username:
youtube_id:
work_url:

contact_note: >
  Best way to reach me: email.

# -----------------------------------------------------------------------------
# Analytics & Verification (optional)
# -----------------------------------------------------------------------------

cronitor_analytics:
google_analytics:
panelbear_analytics:

# -----------------------------------------------------------------------------
# Blog / News
# -----------------------------------------------------------------------------

blog_name: news
blog_description: Updates on research, papers, and talks.
permalink: /blog/:year/:title/

news_scrollable: true
news_limit: 5

# Announcements on the about page
announcements:
  enabled: true
  scrollable: true
  limit: 5

# Social icons under the profile
social: true

# -----------------------------------------------------------------------------
# Collections
# -----------------------------------------------------------------------------

collections:
  news:
    defaults:
      layout: post
    output: true
    permalink: /news/:path/
  projects:
    output: true
    permalink: /projects/:path/

news_limit: 5

# -----------------------------------------------------------------------------
# Jekyll Scholar (publications)
# -----------------------------------------------------------------------------

scholar:
  last_name: [Di Salvo]
  first_name: [Claudio, C.]

  style: apa
  locale: en

  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  replace_strings: true
  join_strings: true

  details_dir: bibliography
  details_layout: bibtex.html
  details_link: Details

  query: "@*"

  group_by: year
  group_order: descending
  bibliography_list_attributes:
    reversed: "reversed"

# Display `selected: true` entries on the about page
selected_papers: true

# Display venue badges
enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: true
  inspirehep: false
  nasaads: false
  openaccess: true

# Filter categories for the publications page
filtered_bibtex_keywords: [abbr, abstract, arxiv, bibtex_show, html, pdf, selected, supp, blog, code, poster, slides, website, preview, altmetric, dimensions, google_scholar_id]

# -----------------------------------------------------------------------------
# Jekyll Plugins
# -----------------------------------------------------------------------------

plugins:
  - jekyll-archives
  - jekyll-diagrams
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-imagemagick
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-toc
  - jekyll-twitter-plugin
  - jemoji

# -----------------------------------------------------------------------------
# Jekyll Archives
# -----------------------------------------------------------------------------

jekyll-archives:
  enabled: [year, tags, categories]
  layouts:
    year: archive-year
    tag: archive-tag
    category: archive-category
  permalinks:
    year: "/blog/:year/"
    tag: "/blog/tag/:name/"
    category: "/blog/category/:name/"

display_tags: []
display_categories: []

# -----------------------------------------------------------------------------
# Pagination
# -----------------------------------------------------------------------------

pagination:
  enabled: true
  collection: posts
  per_page: 6
  permalink: "/page/:num/"
  sort_field: date
  sort_reverse: true
  trail:
    before: 1
    after: 3

# -----------------------------------------------------------------------------
# Optional features
# -----------------------------------------------------------------------------

enable_masonry: true
enable_math: true
enable_tooltips: false
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: true

